seed: 42
data:
  train_npz: ecg_acl/data/mitbih_context_rr_record/processed/train.npz
  val_npz: ecg_acl/data/mitbih_context_rr_record/processed/val.npz
  test_npz: ecg_acl/data/mitbih_context_rr_record/processed/test.npz
  num_classes: 5
  input_channels: 7
  waveform_channels: 3
  input_length: 216
model:
  name: fusion
  embedding_dim: 256
  branch_dim: 128
  birnn_hidden: 64
  birnn_layers: 2
  dropout: 0.3
  branches: [birnn, efficientnet, sequential, lenet]
  aux_weight: 0.2
train:
  epochs: 80
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  selection_metric: balanced_acc
  selection_metrics: [balanced_acc, macro_f1, minority_f1]
  save_top_k: 5
  minority_classes: [1, 2, 3, 4]
  grad_clip_norm: 1.0
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  clean_topk: true
scheduler:
  name: cosine
  min_lr: 0.00001
imbalance:
  weighted_sampler: true
  sampler_power: 1.0
  loss_type: class_balanced_ce
  class_balanced_loss: true
  effective_num_beta: 0.999
  max_class_weight: 8.0
  focal_gamma: 2.0
augmentation:
  enabled: false
  minority_only: true
  minority_max_fraction: 0.25
  noise_std: 0.02
  scale_std: 0.08
  max_shift: 8
affinity:
  start_epoch: 20
  top_k: 5
  overlap_threshold: 2
  inter_weight: 0.1
  intra_weight: 0.1
  temperature: 0.1
  margin: 0.1
  memory_size: 1024
output:
  work_dir: ecg_acl/work_dirs/fusion_context_rr_record_acl
  log_file: train.log
